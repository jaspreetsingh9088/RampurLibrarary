name: rampur_library
description: Rampur Library — member app (Android & iOS).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  library_core:
    path: ../../packages/library_core
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  firebase_messaging: ^17.1.0
  firebase_analytics: ^13.1.0
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0
  intl: ^0.20.2
  image_picker: ^1.2.0
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0
  share_plus: ^13.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.5.0
  package_info_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Generated in CI after `flutter create` (dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#1E4D6B"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 24
