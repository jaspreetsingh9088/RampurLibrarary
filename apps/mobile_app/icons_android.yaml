# dart run flutter_launcher_icons -f icons_android.yaml   (run by CI after `flutter create`)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#1E4D6B"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  min_sdk_android: 24
