<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rampur Library administration panel — catalogue, members, circulation and notifications.">
  <!-- The admin panel is private: keep it out of search engines. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1E4D6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Library Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Rampur Library · Admin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #F7F8FA; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #1E4D6B; }
    #splash img { width: 72px; height: 72px; border-radius: 16px; }
    #splash .bar { width: 160px; height: 4px; background: #dfe6ec; border-radius: 4px; overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #1E4D6B; animation: load 1.1s infinite ease-in-out; }
    @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="Rampur Library">
    <strong>Rampur Library Admin</strong>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash'); if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
