name: Mobile builds (APK / AAB / IPA)

# Builds the member app for Android and iOS. Native projects are generated with
# `flutter create` and configured by scripts/prepare_mobile.py, so they always match
# the Flutter version on the runner.
#
# Every run uploads the builds as workflow artifacts. Pushing a tag like v1.0.0 (or
# running manually with "release" ticked) also publishes them on GitHub Releases.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - apps/mobile_app/**
      - packages/library_core/**
      - scripts/**
      - .github/workflows/mobile.yml
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release with the builds
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: com.rampurlibrary.app
  APP_NAME: Rampur Library
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
  FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
  FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
  FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
  FIREBASE_IOS_CLIENT_ID: ${{ secrets.FIREBASE_IOS_CLIENT_ID }}
  FIREBASE_IOS_BUNDLE_ID: com.rampurlibrary.app
  SITE_URL: ${{ vars.SITE_URL }}

jobs:
  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native project
        run: flutter create --platforms=android --org com.rampurlibrary --project-name rampur_library .

      - name: Firebase config file (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Release keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Configure project
        run: |
          python3 ../../scripts/prepare_mobile.py .
          python3 ../../scripts/write_dart_defines.py dart_defines.json
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APK & App Bundle
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          flutter build apk --release --dart-define-from-file=dart_defines.json --build-number=$BUILD_NUMBER
          flutter build apk --release --split-per-abi --dart-define-from-file=dart_defines.json --build-number=$BUILD_NUMBER
          flutter build appbundle --release --dart-define-from-file=dart_defines.json --build-number=$BUILD_NUMBER
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/RampurLibrary.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/RampurLibrary-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/RampurLibrary-armv7.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/RampurLibrary.aab
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: apps/mobile_app/dist/*

  ios:
    name: iOS IPA
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile_app
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native project
        run: flutter create --platforms=ios --org com.rampurlibrary --project-name rampur_library .

      - name: Firebase config file (optional)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        if: env.GOOGLE_SERVICE_INFO_PLIST != ''
        run: echo "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist

      - name: Configure project
        run: |
          python3 ../../scripts/prepare_mobile.py .
          python3 ../../scripts/write_dart_defines.py dart_defines.json
          flutter pub get
          dart run flutter_launcher_icons
          cd ios && pod install --repo-update

      - name: Install signing certificate & profile
        if: env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != ''
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KC_PASS=$(uuidgen)
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i $RUNNER_TEMP/profile.mobileprovision))
          NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< $(security cms -D -i $RUNNER_TEMP/profile.mobileprovision))
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$IOS_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$APP_ID</key><string>$NAME</string></dict>
          </dict></plist>
          EOF
          # Switch the Runner target to manual signing with this profile
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = $IOS_TEAM_ID; PROVISIONING_PROFILE_SPECIFIER = \"$NAME\"; CODE_SIGN_IDENTITY = \"Apple Distribution\";/" ios/Runner.xcodeproj/project.pbxproj
          echo "SIGNED=1" >> $GITHUB_ENV

      - name: Build signed IPA
        if: env.SIGNED == '1'
        run: |
          flutter build ipa --release --dart-define-from-file=dart_defines.json --build-number=${{ github.run_number }} --export-options-plist=$RUNNER_TEMP/ExportOptions.plist
          mkdir -p dist && cp build/ios/ipa/*.ipa dist/RampurLibrary.ipa

      - name: Build unsigned IPA
        if: env.SIGNED != '1'
        run: |
          flutter build ios --release --no-codesign --dart-define-from-file=dart_defines.json --build-number=${{ github.run_number }}
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qry RampurLibrary-unsigned.ipa Payload && rm -rf Payload)
          echo "::notice::Built an UNSIGNED IPA. Add Apple signing secrets (docs/SETUP.md) to get an installable / App Store build."

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: apps/mobile_app/dist/*

  release:
    name: GitHub Release
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Rampur Library {0}', github.ref_name) || format('Rampur Library build {0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          files: dist/*
