name: Deploy Firebase (rules, indexes, functions)

on:
  push:
    branches: [main]
    paths:
      - firebase/**
      - functions/**
      - firebase.json
      - .github/workflows/firebase.yml
  workflow_dispatch:

concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install & build functions
        working-directory: functions
        run: npm ci && npm run build
      - name: Deploy
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && env.FIREBASE_PROJECT_ID != ''
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only firestore,storage,functions --project "$FIREBASE_PROJECT_ID" --force --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Secrets missing
        if: env.FIREBASE_SERVICE_ACCOUNT == '' || env.FIREBASE_PROJECT_ID == ''
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT / FIREBASE_PROJECT_ID secrets not set — skipped Firebase deploy. See docs/SETUP.md."
